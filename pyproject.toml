[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-review-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pyjwt[crypto]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "code-review-graph[communities]>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "httpx"]
